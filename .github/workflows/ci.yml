name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # feat/** and fix/** let stacked draft PRs (base = another feature branch) run CI too.
    branches: [main, develop, "feat/**", "fix/**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  service-intelligence-lint:
    name: Service Intelligence — Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service-intelligence
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff black
      - run: ruff check app/
      - run: black --check app/

  privacy-boundaries:
    name: Privacy Boundaries — Static Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # stdlib only: fails if raw frames/audio/Mel/landmarks reach a log, audit or analytics
      # sink, or a Fitzpatrick class reaches one outside a consent check.
      - run: python scripts/check_privacy_boundaries.py

  proto-contract-drift:
    name: Proto Contract — pb2 Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Same pins as service-intelligence/requirements*.txt, so a fresh protoc run must
      # reproduce the checked-in stubs byte for byte.
      - run: pip install grpcio-tools==1.63.0 protobuf==5.26.1
      - run: python scripts/check_proto_pb2_drift.py

  service-core-flyway:
    name: Service Core — Flyway V1–V10 on Postgres 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pranascan_core
          POSTGRES_USER: pranascan
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: pranascan
      PGPASSWORD: testpassword
      PGDATABASE: pranascan_core
    steps:
      - uses: actions/checkout@v6
      # Plain psql (preinstalled on the runner): applies the real Flyway scripts in
      # version order with legacy rows seeded between V7 and V8, then runs the probes.
      - run: bash scripts/ci/verify_core_migrations.sh

  service-intelligence-test:
    name: Service Intelligence — Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pranascan_test
          POSTGRES_USER: pranascan
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: service-intelligence
    env:
      DATABASE_URL: postgresql+asyncpg://pranascan:testpassword@localhost:5432/pranascan_test
      SECRET_KEY: test-secret-key-ci
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -v --tb=short --cov=app --cov-report=xml
      - uses: codecov/codecov-action@v6
        if: always()
        with:
          files: service-intelligence/coverage.xml

  mobile-lint:
    name: Mobile — ESLint & TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src/ --ext .ts,.tsx

  mobile-test:
    name: Mobile — Jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test -- --coverage --watchAll=false

  service-core-test:
    name: Service Core — Maven
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service-core
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"
      - run: mvn -B verify
